# Banco H2 salvo em arquivo: as cotações continuam lá mesmo se você reiniciar a aplicação
spring.datasource.url=jdbc:h2:file:./data/frete
spring.datasource.username=sa
spring.datasource.password=

# Cria e atualiza as tabelas sozinho a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Tela para ver o banco no navegador: http://localhost:8080/h2-console
spring.h2.console.enabled=true
