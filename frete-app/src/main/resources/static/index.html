<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de Frete</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #222; }
        h1 { margin-bottom: 4px; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0; }
        label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
        input { padding: 8px; font-size: 15px; border: 1px solid #bbb; border-radius: 6px; }
        button { grid-column: span 2; padding: 10px; font-size: 16px; background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
        #resultado { padding: 12px; border-radius: 6px; margin-bottom: 24px; display: none; }
        #resultado.ok { background: #e6f4ea; display: block; }
        #resultado.erro { background: #fde8e8; display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
<h1>Calculadora de Frete</h1>
<p>Medidas em centímetros e peso em quilos.</p>

<form id="form">
    <label>Origem <input name="origem" required></label>
    <label>Destino <input name="destino" required></label>
    <label>Peso (kg) <input name="peso" type="number" step="0.01" required></label>
    <label>Altura (cm) <input name="altura" type="number" step="0.01" required></label>
    <label>Largura (cm) <input name="largura" type="number" step="0.01" required></label>
    <label>Comprimento (cm) <input name="comprimento" type="number" step="0.01" required></label>
    <button type="submit">Calcular</button>
</form>

<div id="resultado"></div>

<h2>Cotações salvas</h2>
<table>
    <thead>
    <tr><th>#</th><th>Origem</th><th>Destino</th><th>Peso (kg)</th><th>Peso cubado (kg)</th></tr>
    </thead>
    <tbody id="historico"></tbody>
</table>

<script>
    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');
    const historico = document.getElementById('historico');

    // 1. Usuário clica em Calcular: envia um POST para o Controller
    form.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const dados = Object.fromEntries(new FormData(form));

        const resposta = await fetch('/api/cotacoes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });

        if (!resposta.ok) {
            resultado.className = 'erro';
            resultado.textContent = await resposta.text();
            return;
        }

        const cotacao = await resposta.json();
        resultado.className = 'ok';
        resultado.textContent = `${cotacao.origem} → ${cotacao.destino}: peso ${cotacao.peso} kg, peso cubado ${cotacao.pesoCubado.toFixed(2)} kg`;
        form.reset();
        carregarHistorico();
    });

    // 2. Busca a lista salva no banco com um GET
    async function carregarHistorico() {
        const resposta = await fetch('/api/cotacoes');
        const cotacoes = await resposta.json();

        historico.innerHTML = '';
        for (const c of cotacoes) {
            const linha = historico.insertRow();
            [c.id, c.origem, c.destino, c.peso, c.pesoCubado.toFixed(2)]
                .forEach(valor => linha.insertCell().textContent = valor);
        }
    }

    carregarHistorico();
</script>
</body>
</html>
